# Machine-readable version manifest for sparkplugb-interop.
# Upstream pins and image digests are release inputs; nothing floats.
# The Dockerfiles and adapter build files are the source of truth for a build:
# scripts/check-versions.sh fails when this file disagrees with them.

interop_version: "0.3.0"
contract_version: "0.2"        # docs/CONTAINER_CONTRACT.md (draft until 1.0); documents carry schemaVersion "1.0"
fixture_schema: "1.0"          # fixtures/schema/sparkplugb-fixture.schema.json

protocol:
  name: "Sparkplug B"
  version: "3.0.0"
  transport: "MQTT 3.1.1"

# The MQTT brokers the self-tests run on, pinned by multi-arch index digest.
# They are not part of any adapter image; consumers pin the same references.
# scripts/lib.sh reads the "image:" lines.
brokers:
  mosquitto:
    upstream: "Eclipse Mosquitto"
    version: "2.1.2"
    image: "eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f"
    license: "EPL-2.0 OR BSD-3-Clause"
    note: "Run with its bundled /mosquitto-no-auth.conf (anonymous, all interfaces). Its mosquitto_pub is the readiness probe of every broker."
  hivemq-ce:
    upstream: "HiveMQ Community Edition"
    version: "2026.5"
    image: "hivemq/hivemq-ce:2026.5@sha256:bac6d4d1d815bffe4bc9a7fca8d06ea12b32d34f84ef2f1851ff4548560ee67b"
    license: "Apache-2.0"
  emqx:
    upstream: "EMQX"
    version: "6.3.2"
    image: "emqx/emqx:6.3.2@sha256:135116400e11b25224350b2e55c874f4e224d357b593fb554ca1b1f398c631ac"
    license: "BSL-1.1"
    note: "Only run by the tests, never redistributed."
  nanomq:
    upstream: "NanoMQ"
    version: "0.25.7"
    image: "emqx/nanomq:0.25.7@sha256:ed5a9bb892f58e59aa4e47a9932fb7e056f5ae57ba201414c793b8c961587784"
    license: "MIT"

# Base images of the adapter Dockerfiles, pinned by multi-arch index digest
# (scripts/check-versions.sh: every ARG *_DIGEST of a Dockerfile is here).
base_images:
  maven: "maven:3.9.16-eclipse-temurin-21-noble@sha256:99e61abcff91a9b1333463bd8451fb18495d6eba9250ac66a338b518f8278320"   # tahu (build)
  eclipse-temurin: "eclipse-temurin:21.0.12.1_1-jre-noble@sha256:dd4cbbf22ea3efd0b0bf3c72618a1999e6ba7394afdebf2d0780b2fdee8c6694"   # tahu
  python: "python:3.13-slim-trixie@sha256:57b29a7c050c4e679e4bea572e14b3965cf4b5839de2da49d55e49ffc4024f39"   # pysparkplug
  dotnet-sdk: "mcr.microsoft.com/dotnet/sdk:10.0@sha256:de4fe90a98845d75910b9769662465c84de1a934665c431279d1382b2bddc02b"   # sparkplugnet (build)
  dotnet-runtime: "mcr.microsoft.com/dotnet/runtime:10.0@sha256:a3f9f81954b9c810af2ed18849716c8dc74a4707bd0907fdbd69be81554c0f30"   # sparkplugnet
  rust: "rust:1.95-slim-trixie@sha256:e14e87345b4d5964ddcc3491d27ee046a0f23820f340c3c1e24da6880141f7c0"   # srad (build)
  node: "node:22-trixie-slim@sha256:8eb619e402eaede1748a3c8173bffab391592812e85136452f781741c7242ddf"   # tahu-js
  golang: "golang:1.25.14-trixie@sha256:2c4c60ef415fbfa5e90300722293bef36c5e63fae17570ce18f580af933dbd73"   # sparkplughost (build)
  debian: "debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad"   # srad, sparkplughost

