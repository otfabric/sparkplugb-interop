name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Start broker matrix
        run: docker compose up -d

      - name: Wait for brokers
        run: |
          for port in 1883 1884 1885 1886; do
            echo "Waiting for broker on port ${port}..."
            timeout 120 bash -c "until nc -z localhost ${port}; do sleep 2; done"
          done
          sleep 5
          echo "All brokers ready."

      - name: Run E2E tests
        run: go test -tags e2e ./tests/... -v -timeout=120s

      - name: Tear down
        if: always()
        run: docker compose down -v
