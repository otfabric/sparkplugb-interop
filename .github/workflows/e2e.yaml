name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Pull broker images
        run: docker compose pull

      - name: Start broker matrix and wait for health
        run: docker compose up -d --wait --wait-timeout 180

      - name: Run E2E tests
        run: go test -tags e2e ./tests/... -v -timeout=120s

      - name: Tear down
        if: always()
        run: docker compose down -v
