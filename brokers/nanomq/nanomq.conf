mqtt {
    property_size = 32
    max_packet_size = 256KB
    max_mqueue_len = 2048
    retry_interval = 10s
    keepalive_multiplier = 1.25
    max_inflight_window = 2048
}

listeners.tcp {
    bind = "0.0.0.0:1883"
}

log {
    to = [console]
    level = warn
}

auth {
    allow_anonymous = true
    no_match = allow
}
